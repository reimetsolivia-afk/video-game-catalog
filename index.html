<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Explorer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 {
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 28px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      font-size: 15px;
    }

    button {
      background: #6366f1;
      border-color: #6366f1;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #4f46e5;
    }

    #status {
      color: #9ca3af;
      margin: 18px 0;
    }

    .game {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .game a {
      color: #a5b4fc;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .game a:hover {
      color: #c7d2fe;
      text-decoration: underline;
    }

    .date {
      color: #9ca3af;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 Game Explorer</h1>

    <p class="subtitle">
      Discover video games using data from Wikidata.
    </p>

    <div class="filters">
      <select id="genre" aria-label="Game genre">
        <option value="">All genres</option>
        <option value="Q744038">RPG</option>
        <option value="Q188055" selected>Puzzle</option>
      </select>

      <select id="platform" aria-label="Game platform">
        <option value="">All platforms</option>
        <option value="Q1406">PC (Windows)</option>
      </select>

      <select id="decade" aria-label="Release decade">
        <option value="">All decades</option>
        <option value="1990">1990s</option>
        <option value="2000">2000s</option>
        <option value="2010">2010s</option>
        <option value="2020" selected>2020s</option>
      </select>

      <button onclick="searchGames()">Search games</button>
    </div>

    <p id="status">Ready to search.</p>
    <div id="results"></div>
  </div>

  <script>
    async function searchGames() {
      const genre = document.getElementById("genre").value;
      const platform = document.getElementById("platform").value;
      const decade = document.getElementById("decade").value;
      const results = document.getElementById("results");
      const status = document.getElementById("status");

      results.replaceChildren();
      status.textContent = "Searching Wikidata...";

      let filters = "";

      if (genre) {
        filters += `?game wdt:P136 wd:${genre}.`;
      }

      if (platform) {
        filters += `?game wdt:P400 wd:${platform}.`;
      }

      if (decade !== "") {
        const start = Number(decade);
        const end = start + 10;

        filters += `
          ?game wdt:P577 ?date.
          FILTER(?date >= "${start}-01-01T00:00:00Z"^^xsd:dateTime)
          FILTER(?date < "${end}-01-01T00:00:00Z"^^xsd:dateTime)
        `;
      } else {
        filters += `
          OPTIONAL { ?game wdt:P577 ?date. }
        `;
      }

      const query = `
        SELECT ?game ?gameLabel (MIN(?date) AS ?releaseDate)
        WHERE {
          hint:Query hint:optimizer "None" .

          ?game wdt:P31 wd:Q7889.

          ${filters}

          FILTER NOT EXISTS {
            ?game wdt:P31 wd:Q11424.
          }

          SERVICE wikibase:label {
            bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
          }
        }
        GROUP BY ?game ?gameLabel
        ORDER BY ?gameLabel
        LIMIT 50
      `;

      try {
        const url =
          "https://query.wikidata.org/sparql?format=json&query=" +
          encodeURIComponent(query);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);

        let response;

        try {
          response = await fetch(url, {
            headers: {
              Accept: "application/sparql-results+json"
            },
            signal: controller.signal
          });
        } finally {
          clearTimeout(timeout);
        }

        if (!response.ok) {
          throw new Error(
            "Wikidata request failed: " + response.status
          );
        }

        const data = await response.json();
        const games = data.results.bindings;

        if (games.length === 0) {
          status.textContent =
            "No games found. Try changing your filters.";
          return;
        }

        status.textContent = `Found ${games.length} games:`;

        for (const item of games) {
          const card = document.createElement("div");
          card.className = "game";

          const link = document.createElement("a");
          link.href = item.game.value;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          // Display the readable label, not the Wikidata URL.
          const gameUrl = item.game.value;
          const fallbackId = gameUrl.split("/").pop();

          link.textContent =
            item.gameLabel?.value || fallbackId;

          const date = document.createElement("div");
          date.className = "date";

          if (item.releaseDate?.value) {
            date.textContent =
              "Release date: " +
              item.releaseDate.value.substring(0, 10);
          } else {
            date.textContent = "Release date not available";
          }

          card.append(link, date);
          results.appendChild(card);
        }
      } catch (error) {
        if (error.name === "AbortError") {
          status.textContent =
            "The search took too long. Please try again.";
        } else {
          status.textContent =
            "Could not load games. Please try again in a moment.";
        }

        console.error(error);
      }
    }

    // Run a search when the page opens.
    searchGames();
  </script>
</body>
</html>
